name: tests

on:
  push:
  pull_request:

permissions:
  contents: write  # allow publishing the coverage badge to the `badges` branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run test suite with coverage
        run: uv run pytest --cov=abcd_ksads --cov-report=xml --cov-report=term-missing

      # --- coverage badge (main only): generate an SVG and publish it to the
      #     `badges` branch, which the README references. Self-contained: no
      #     external services and no secrets beyond the built-in GITHUB_TOKEN.
      - name: Generate coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public
          uv run --with "genbadge[coverage]" \
            genbadge coverage -i coverage.xml -o public/coverage.svg

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: ./public
          force_orphan: true
          commit_message: "Update coverage badge"
